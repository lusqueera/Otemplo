# Proxy reverso HTTP para o gunicorn. Sem domínio não há TLS; ao apontar um domínio,
# troque server_name e rode `certbot --nginx`.
server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 10m;  # avatar em base64 (limite de 5 MB no backend)

    location /static/ {
        alias /srv/atelier/staticfiles/;
        expires 7d;
    }

    location /media/ {
        alias /srv/atelier/media/;
    }

    location / {
        proxy_pass http://unix:/run/atelier/atelier.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
